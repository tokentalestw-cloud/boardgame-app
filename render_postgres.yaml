services:
  - type: web
    name: boardgame-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements_postgres.txt
    startCommand: uvicorn boardgame_web_render_postgres:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: boardgame-db
          property: connectionString
      - key: DATA_DIR
        value: /var/data
    disk:
      name: boardgame-data
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: boardgame-db
    databaseName: boardgame
    user: boardgame_user
    plan: free
